# providerName must match the handler registration name used by the WFE.
workflow-engine:
  providerName: getting-started-sample
  providerMetadata:
    displayName: Java Sample Provider
    description: A sample provider for the Kaleido Workflow Engine using the Java SDK
  ws:
    url: wss://my-account.my-kaleido.io/endpoint/my-environment/my-workflow-engine/ws
  url: https://my-account.my-kaleido.io/endpoint/my-environment/my-workflow-engine/rest
  auth:
    type: basic
    username: my-api-key-name
    password: my-api-key
  # retryDelay: 2s
  # maxRetries: 5   # omit for infinite retries
