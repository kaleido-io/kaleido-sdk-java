name: PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build core + starter
        run: ./gradlew build

      - name: Publish to Maven Local (for samples)
        run: ./gradlew publishToMavenLocal

      - name: Build and test samples
        run: ./gradlew :samples:hello-world:build :samples:erc20:build
